<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizzatore di Sicurezza Web</title>
    <!-- Importa Tailwind CSS per lo styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importa Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(17, 24, 39, 0.6), rgba(17, 24, 39, 0.8)), url('Sfondo1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        /* Personalizzazione della barra di scorrimento coerente con l'hub */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="text-gray-200 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl relative">
        
        <!-- Pulsante Home posizionato sopra la finestra -->
        <div class="mb-4 flex justify-start">
            <a href="index.html" class="inline-flex items-center bg-gray-800/50 backdrop-blur-sm border border-gray-700 hover:bg-gray-700 text-gray-300 font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-md">
                &larr; Home
            </a>
        </div>

        <!-- Contenitore principale stile "Page" dell'hub -->
        <div class="w-full bg-gray-800/50 backdrop-blur-sm rounded-2xl shadow-2xl shadow-cyan-500/10 border border-gray-700 p-6 md:p-8">
            
            <!-- Intestazione -->
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-100 drop-shadow-lg mb-2 flex items-center justify-center gap-3">
                    <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    Analizzatore di Sicurezza Web
                </h1>
                <p class="text-gray-300 font-medium mt-2">Strumento di analisi passiva per individuare falle di sicurezza e configurazioni errate di un sito web.</p>
            </div>

            <!-- Sezione Input Target -->
            <div class="mb-8">
                <label for="targetInput" class="block text-sm font-medium text-gray-300 mb-2">Sito da analizzare (es. example.com)</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="targetInput" placeholder="Inserisci il dominio..." 
                        class="flex-1 w-full bg-gray-900 border border-gray-600 rounded-lg p-3 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition duration-200 placeholder-gray-500 text-white">
                    
                    <button id="generateBtn" 
                        class="w-full sm:w-auto bg-gradient-to-r from-cyan-600 to-teal-500 hover:from-cyan-700 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition duration-300 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Verifica Vulnerabilità
                    </button>
                </div>
                <p id="errorMsg" class="text-red-400 text-sm mt-2 hidden">Per favore, inserisci un dominio valido.</p>
            </div>

            <!-- Contenitore Risultati (Nascosto di default) -->
            <div id="resultsContainer" class="hidden mt-10">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-6 gap-4">
                    <h2 class="text-2xl font-bold text-gray-100">Test per: <span id="targetDisplay" class="text-cyan-300 drop-shadow-md"></span></h2>
                    <button id="copyAllBtn" class="text-sm bg-gray-700 hover:bg-gray-600 text-gray-200 py-2 px-4 rounded-lg transition-colors flex items-center gap-2 shadow">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copia URL Selezionati
                    </button>
                </div>

                <!-- Griglia delle categorie (popolata dal JS) -->
                <div id="dorksGrid" class="space-y-6">
                    <!-- I contenuti verranno iniettati qui -->
                </div>
                
                <!-- Pulsanti a fondo pagina -->
                <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4 border-t border-gray-700/50 pt-8">
                    <button id="newSearchBtn" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-md flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Nuova Ricerca
                    </button>
                    <a href="index.html" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 text-gray-300 font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-md flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        Torna alla Home
                    </a>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Script JavaScript per la logica dell'applicazione -->
    <script>
        // Database dei dork divisi per categoria
        const dorksData = [
            {
                category: "Directory Esposte (Directory Listing)",
                description: "Verifica se il server mostra l'elenco dei file, esponendo la struttura del sito.",
                queries: [
                    { name: "Indice standard", query: 'intitle:"index of"' },
                    { name: "Server Apache", query: 'intitle:"index of" "Apache/2.4"' },
                    { name: "Indice con dettagli file", query: 'intitle:"index of" "Name" "Last modified" "Size"' }
                ]
            },
            {
                category: "Credenziali e Segreti Esposti",
                description: "Ricerca di file mal protetti contenenti password, chiavi API o impostazioni di sistema.",
                queries: [
                    { name: "File Env (Ambiente)", query: 'ext:env | ext:yml | ext:json "password" | "secret"' },
                    { name: "File di Configurazione", query: 'ext:xml | ext:conf | ext:cnf | ext:reg | ext:inf | ext:rdp | ext:cfg | ext:txt | ext:ora | ext:ini' },
                    { name: "Chiavi Private (SSH/PEM)", query: 'ext:pem | ext:key | ext:ppk | intitle:"index of" id_rsa' }
                ]
            },
            {
                category: "Database e Backup Esposti",
                description: "Ricerca di dump del database e file di backup lasciati per errore nella cartella pubblica.",
                queries: [
                    { name: "Dump SQL e DB", query: 'ext:sql | ext:dbf | ext:mdb | ext:db | ext:sqlite' },
                    { name: "File di Log", query: 'ext:log' },
                    { name: "Backup generici", query: 'ext:bkf | ext:bkp | ext:bak | ext:old | ext:backup' }
                ]
            },
            {
                category: "Pannelli Amministrativi Scoperti",
                description: "Pannelli di controllo non protetti adeguatamente o indicizzati dai motori di ricerca.",
                queries: [
                    { name: "Pagine di Login generiche", query: 'inurl:login | inurl:signin | intitle:Login | intitle:"sign in" | inurl:auth' },
                    { name: "Pannelli di Amministrazione", query: 'inurl:admin | inurl:administrator | intitle:admin' },
                    { name: "WordPress Admin", query: 'inurl:wp-admin | inurl:wp-content' }
                ]
            },
            {
                category: "Fuga di Documenti Sensibili",
                description: "Documentazione aziendale che potrebbe essere stata indicizzata erroneamente.",
                queries: [
                    { name: "Documenti d'ufficio", query: 'ext:doc | ext:docx | ext:odt | ext:pdf | ext:rtf | ext:sxw | ext:psw | ext:ppt | ext:pptx | ext:pps | ext:csv' },
                    { name: "Fogli di calcolo (potenziali email/dati)", query: 'ext:xls | ext:xlsx | ext:ods' }
                ]
            },
            {
                category: "File JSON e Dati API Esportati",
                description: "Ricerca di file JSON che potrebbero esporre dati utente, configurazioni API o token di accesso.",
                queries: [
                    { name: "File JSON generici", query: 'ext:json' },
                    { name: "Dati utenti/API in JSON", query: 'ext:json "users" | "api_key" | "token" | "secret" | "credentials"' },
                    { name: "Configurazioni NPM (package.json)", query: 'intitle:"index of" package.json' }
                ]
            },
            {
                category: "Verifiche CMS (WordPress, Joomla, Laravel)",
                description: "Ricerca di file sensibili o percorsi di log specifici per i CMS e framework più diffusi.",
                queries: [
                    { name: "Esposizione wp-config (WordPress)", query: 'ext:txt | ext:cfg | ext:env | ext:ini "wp-config"' },
                    { name: "Backup File (WordPress)", query: 'ext:sql | ext:tar.gz | ext:zip "wp-content/uploads"' },
                    { name: "Esposizione configuration.php (Joomla)", query: 'ext:txt | ext:cfg | ext:ini "configuration.php"' },
                    { name: "Log errori Laravel", query: 'ext:log "laravel.log" | "stack trace"' }
                ]
            },
            {
                category: "Vulnerabilità Note ed Errori di Sistema",
                description: "Messaggi di errore in chiaro che rivelano la struttura interna o i percorsi del server.",
                queries: [
                    { name: "Errori PHP", query: '"Warning: require_once" | "Fatal error:" | "Call to undefined function"' },
                    { name: "Errori SQL", query: '"SQL syntax" | "MySQL Query fail" | "ORA-01756"' }
                ]
            }
        ];

        // Elementi DOM
        const targetInput = document.getElementById('targetInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const targetDisplay = document.getElementById('targetDisplay');
        const dorksGrid = document.getElementById('dorksGrid');
        const errorMsg = document.getElementById('errorMsg');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const newSearchBtn = document.getElementById('newSearchBtn');

        // Memorizza tutti i link generati per la funzione di copia
        let generatedLinks = [];

        // Funzione per validare il dominio
        function isValidDomain(domain) {
            const regex = /^(?!:\/\/)([a-zA-Z0-9-_]+\.)*[a-zA-Z0-9][a-zA-Z0-9-_]+\.[a-zA-Z]{2,11}?$/;
            if (domain === 'localhost') return true;
            return regex.test(domain) || /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(domain);
        }

        // Funzione principale per generare l'UI
        function generateDorks() {
            let target = targetInput.value.trim();
            
            target = target.replace(/^https?:\/\//, '');
            target = target.replace(/\/$/, '');

            if (!target || !isValidDomain(target)) {
                errorMsg.classList.remove('hidden');
                targetInput.classList.add('border-red-500');
                resultsContainer.classList.add('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            targetInput.classList.remove('border-red-500');
            targetDisplay.textContent = target;
            dorksGrid.innerHTML = '';
            generatedLinks = [];

            // Popola le categorie con il nuovo stile glassmorphism
            dorksData.forEach((categoryData, catIndex) => {
                const catDiv = document.createElement('div');
                catDiv.className = 'bg-gray-800/50 backdrop-blur-sm rounded-xl border border-gray-700 overflow-hidden shadow-lg';
                
                const headerHtml = `
                    <div class="bg-gray-800/80 px-5 py-4 border-b border-gray-700">
                        <h3 class="text-lg font-bold text-cyan-300 drop-shadow-md">${categoryData.category}</h3>
                        <p class="text-sm text-gray-400 mt-1">${categoryData.description}</p>
                    </div>
                `;
                catDiv.innerHTML = headerHtml;

                const ul = document.createElement('ul');
                ul.className = 'divide-y divide-gray-700/50';

                categoryData.queries.forEach((q, qIndex) => {
                    const fullQuery = `site:${target} ${q.query}`;
                    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(fullQuery)}`;
                    
                    generatedLinks.push(searchUrl);

                    const li = document.createElement('li');
                    li.className = 'px-5 py-4 hover:bg-gray-700/40 flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-colors';
                    
                    li.innerHTML = `
                        <div class="flex-1">
                            <p class="text-gray-200 font-semibold mb-1">${q.name}</p>
                            <code class="text-xs text-teal-300 bg-gray-900/80 px-2 py-1.5 rounded inline-block break-all border border-gray-700">${fullQuery}</code>
                        </div>
                        <a href="${searchUrl}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center justify-center whitespace-nowrap bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-semibold py-2.5 px-4 rounded-lg transition-colors focus:ring-2 focus:ring-cyan-500 focus:outline-none shadow-md">
                            Cerca su Google
                            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    `;
                    ul.appendChild(li);
                });

                catDiv.appendChild(ul);
                dorksGrid.appendChild(catDiv);
            });

            resultsContainer.classList.remove('hidden');
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Event Listeners
        generateBtn.addEventListener('click', generateDorks);

        targetInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateDorks();
            }
        });

        copyAllBtn.addEventListener('click', () => {
            if (generatedLinks.length === 0) return;
            
            const textToCopy = generatedLinks.join('\n');
            
            const copyToClipboard = str => {
                const el = document.createElement('textarea');
                el.value = str;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            };

            copyToClipboard(textToCopy);

            // Feedback visivo aggiornato al colore ciano
            const originalText = copyAllBtn.innerHTML;
            copyAllBtn.innerHTML = `<svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copiati!`;
            copyAllBtn.classList.add('border-cyan-500', 'text-cyan-400', 'border');
            
            setTimeout(() => {
                copyAllBtn.innerHTML = originalText;
                copyAllBtn.classList.remove('border-cyan-500', 'text-cyan-400', 'border');
            }, 2000);
        });

        // Event Listener per resettare la ricerca
        newSearchBtn.addEventListener('click', () => {
            targetInput.value = '';
            resultsContainer.classList.add('hidden');
            targetDisplay.textContent = '';
            dorksGrid.innerHTML = '';
            errorMsg.classList.add('hidden');
            targetInput.classList.remove('border-red-500');
            generatedLinks = [];
            
            // Riporta la visuale in alto e ridà il focus all'input
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => targetInput.focus(), 300);
        });

    </script>
</body>
</html>
